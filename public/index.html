<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Toss a grudge · Grump Sleigh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Mountains+of+Christmas:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/submit.css">
</head>
<body>
  <main class="card">
    <svg class="mascot" viewBox="-125 -345 330 350" aria-hidden="true"></svg>
    <h1 data-cfg="form.heading">Got a grudge?</h1>
    <p class="intro" data-cfg="form.intro">Give it to the Grumpster. He'll haul it away before Christmas.</p>

    <form id="grudge-form" autocomplete="off" novalidate>
      <label for="grudge" class="sr-only">Your grudge</label>
      <div class="paper">
        <textarea id="grudge" name="grudge" rows="3" maxlength="80" required
          placeholder="e.g. The printer that jams every Monday" data-cfg-placeholder="form.placeholder"></textarea>
      </div>
      <div class="meta">
        <span class="rule" data-cfg="form.note">Keep it light. No names, please!</span>
        <span id="count" aria-live="polite">0/80</span>
      </div>
      <button type="submit" id="send" data-cfg="form.button">Toss it in the sack</button>
      <p class="privacy" data-cfg="form.privacy">Anonymous. We don't collect names or emails.</p>
    </form>

    <section id="result" hidden>
      <div class="ball" aria-hidden="true"></div>
      <p id="result-msg"></p>
      <button type="button" id="again" data-cfg="form.another">Toss another</button>
    </section>
  </main>
  <script src="js/art.js"></script>
  <script src="js/submit.js"></script>
</body>
</html>
